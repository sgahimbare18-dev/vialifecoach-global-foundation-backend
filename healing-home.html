<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sacred Sounds - Healing Programs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Poppins', 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, #0a0f1e 0%, #0d1525 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Programs Page */
        .programs-page {
            min-height: 100vh;
        }

        .hero {
            text-align: center;
            padding: 60px 20px 40px;
            position: relative;
        }

        .hero h1 {
            font-size: 3.5em;
            background: linear-gradient(135deg, #fff 0%, #a8c0ff 50%, #3f2b96 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 1.2em;
            max-width: 600px;
            margin: 0 auto;
            opacity: 0.8;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .back-btn:hover {
            background: rgba(102,126,234,0.3);
            transform: translateX(-5px);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 2em;
            margin-bottom: 50px;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 2px;
        }

        .programs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        .program-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .program-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 30px 50px rgba(0,0,0,0.3);
            border-color: rgba(102,126,234,0.5);
        }

        .card-icon {
            font-size: 4em;
            text-align: center;
            padding: 40px 20px 20px;
            background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2));
        }

        .card-content {
            padding: 25px;
            text-align: center;
        }

        .card-title {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff, #a8c0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .card-description {
            color: rgba(255,255,255,0.7);
            line-height: 1.5;
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        .card-meta {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .card-meta span {
            font-size: 0.85em;
            color: rgba(102,126,234,0.9);
        }

        .play-button {
            display: inline-block;
            margin-top: 15px;
            padding: 8px 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 25px;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            position: relative;
            max-width: 900px;
            margin: 60px auto;
            background: linear-gradient(135deg, rgba(20,30,45,0.98), rgba(15,25,35,0.98));
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(102,126,234,0.3);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .close-modal:hover {
            transform: rotate(90deg);
            color: #667eea;
        }

        .track-button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
            margin: 10px 0;
        }

        .track-button:hover {
            background: rgba(102,126,234,0.3);
            transform: translateX(5px);
        }

        .now-playing {
            background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2));
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }

        .control-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 12px 30px;
            border-radius: 30px;
            color: white;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: #667eea;
        }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2em; }
            .modal-content { margin: 20px; padding: 25px; }
        }
    </style>
</head>
<body data-api-base="http://localhost:5000">
    <!-- Programs Page -->
    <div class="programs-page">
        <a href="healing-program.html" class="back-btn">
            ← Back to Welcome
        </a>
        
        <div class="hero">
            <h1>🌙 Sacred Space</h1>
            <p>Choose the frequency that calls to your soul</p>
        </div>

        <div class="container">
            <div class="section-title">✨ Select Your Healing Frequency ✨</div>
            <div class="programs-grid" id="programsGrid"></div>
        </div>
    </div>

    <!-- Audio Modal -->
    <div id="audioModal" class="modal">
        <div class="modal-content">
            <div class="close-modal" onclick="closeAudioModal()">×</div>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const storedApiBase = localStorage.getItem('vf_api_base');
        const defaultApiBase = (window.location.origin === 'null' || window.location.origin.includes('localhost:3000'))
            ? 'http://localhost:5000'
            : window.location.origin;
        const API_BASE = storedApiBase || document.body.dataset.apiBase || defaultApiBase;
        const apiUrl = (path) => {
            if (path.startsWith('http')) return path;
            const base = API_BASE.endsWith('/') ? API_BASE.slice(0, -1) : API_BASE;
            const fullPath = path.startsWith('/') ? path : `/${path}`;
            return `${base}${fullPath}`;
        };

        let currentUser = { name: "Healing Soul", id: "healer_001" };
        let currentProgram = null;
        let currentAudio = null;
        let audioUrls = {};

        // Healing Programs with your 10 sounds
        const healingPrograms = [
            { id: 1, title: "🌬️ Air", description: "Breathe in peace, breathe out tension. Let the gentle air element cleanse your spirit.", icon: "🌬️", duration: "15 min", frequency: "432 Hz", trackName: "Air - AShamaluevMusic", trackFile: "Air - AShamaluevMusic.mp3" },
            { id: 2, title: "✨ Aura", description: "Cleanse and strengthen your energetic field. Restore your natural radiance.", icon: "✨", duration: "18 min", frequency: "528 Hz", trackName: "Aura - AShamaluevMusic", trackFile: "Aura - AShamaluevMusic.mp3" },
            { id: 3, title: "🍃 Calm Relaxing", description: "Surrender to deep tranquility. Let soothing melodies restore inner harmony.", icon: "🍃", duration: "20 min", frequency: "639 Hz", trackName: "Calm Relaxing - AShamaluevMusic", trackFile: "Calm Relaxing - AShamaluevMusic.mp3" },
            { id: 4, title: "🎻 Cinematic Orchestral", description: "Epic and uplifting. A journey through emotions that inspires transformation.", icon: "🎻", duration: "22 min", frequency: "741 Hz", trackName: "Cinematic Orchestral A", trackFile: "Cinematic Orchestral A.mp3" },
            { id: 5, title: "🌊 Deep Relaxation", description: "Plunge into profound stillness. Experience cellular-level healing.", icon: "🌊", duration: "25 min", frequency: "852 Hz", trackName: "Deep Relaxation - AShamaluevMusic", trackFile: "Deep Relaxation - AShamaluevMusic.mp3" },
            { id: 6, title: "🕊️ Peaceful", description: "Wrap yourself in divine serenity. A gentle embrace for your soul.", icon: "🕊️", duration: "15 min", frequency: "396 Hz", trackName: "Peaceful - AShamaluevMusic", trackFile: "Peaceful - AShamaluevMusic.mp3" },
            { id: 7, title: "💚 Recovery", description: "Nurture your healing process. Support emotional recovery.", icon: "💚", duration: "20 min", frequency: "417 Hz", trackName: "Recovery - AShamaluevMusic", trackFile: "Recovery - AShamaluevMusic.mp3" },
            { id: 8, title: "😌 Relax", description: "Simply let go. Return to your natural state of ease.", icon: "😌", duration: "12 min", frequency: "285 Hz", trackName: "Relax - AShamaluevMusic", trackFile: "Relax - AShamaluevMusic.mp3" },
            { id: 9, title: "🧘 Relaxation", description: "Deep meditative state. Perfect for meditation and contemplation.", icon: "🧘", duration: "30 min", frequency: "174 Hz", trackName: "Relaxation - AShamaluevMusic", trackFile: "Relaxation - AShamaluevMusic.mp3" },
            { id: 10, title: "🌌 Relaxing Ambient", description: "Cosmic tranquility. Drift through ethereal soundscapes.", icon: "🌌", duration: "28 min", frequency: "963 Hz", trackName: "Relaxing Ambient - AShamaluevMusic", trackFile: "Relaxing Ambient - AShamaluevMusic.mp3" }
        ];

        function loadPrograms() {
            const grid = document.getElementById('programsGrid');
            grid.innerHTML = '';
            healingPrograms.forEach(program => {
                const card = document.createElement('div');
                card.className = 'program-card';
                card.onclick = () => openProgram(program);
                card.innerHTML = `
                    <div class="card-icon">${program.icon}</div>
                    <div class="card-content">
                        <div class="card-title">${program.title}</div>
                        <div class="card-description">${program.description}</div>
                        <div class="card-meta">
                            <span>⏱️ ${program.duration}</span>
                            <span>🎵 ${program.frequency}</span>
                        </div>
                        <div class="play-button">🎧 Listen Now</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function checkBackendConnection() {
            try {
                const response = await fetch(apiUrl('/api/health'));
                const data = await response.json();
                console.log('Backend connected:', data);
                return true;
            } catch (error) {
                console.error('Backend not connected:', error);
                return false;
            }
        }

        async function fetchAudioUrls() {
            const programId = 'd5cf9d00-4acf-4c48-9a73-10c4ee73c346';
            try {
                const response = await fetch(apiUrl(`/api/healing/programs/${programId}?userId=${currentUser.id}`));
                const data = await response.json();
                console.log('API Response:', data); // Debug: See full API response
                
                if (data.success && data.audio.background_music) {
                    data.audio.background_music.forEach(track => {
                        console.log('Track:', track.track_title, 'URL:', track.signed_url); // Debug: See each track
                        if (track.signed_url) {
                            audioUrls[track.track_title] = track.signed_url;
                        }
                    });
                }
            } catch (error) {
                console.error('Error fetching audio:', error);
            }
        }

        function openProgram(program) {
            currentProgram = program;
            document.getElementById('audioModal').style.display = 'block';
            
            const audioUrl = audioUrls[program.trackName];
            console.log('Looking for audio URL:', program.trackName, 'Found:', audioUrl ? 'YES' : 'NO'); // Debug
            
            document.getElementById('modalContent').innerHTML = `
                <h2 style="font-size: 2em; margin-bottom: 10px;">${program.icon} ${program.title}</h2>
                <p style="margin-bottom: 20px; opacity: 0.8;">${program.description}</p>
                <div class="track-button" onclick="playTrack()">
                    🎧 ${program.trackName} • ${program.duration} • ${program.frequency}
                </div>
                <div id="nowPlayingSection" class="now-playing" style="display: none;">
                    🎵 Now Playing: <strong id="currentTrackName"></strong>
                </div>
                <audio id="audioPlayer" controls></audio>
                <div style="margin-top: 20px; text-align: center;">
                    <button class="control-btn" onclick="stopPlayback()">⏹️ Stop</button>
                    <button class="control-btn" onclick="closeAudioModal()">🔒 Close</button>
                </div>
            `;
            
            if (audioUrl) {
                const audio = document.getElementById('audioPlayer');
                audio.src = audioUrl;
                document.getElementById('nowPlayingSection').style.display = 'block';
                document.getElementById('currentTrackName').innerHTML = program.trackName;
                console.log('Audio src set to:', audioUrl); // Debug
            } else {
                document.getElementById('modalContent').innerHTML += '<p style="color: #ffaa66; margin-top: 20px;">✨ Preparing your healing sound... ✨</p>';
                console.log('No audio URL found for:', program.trackName); // Debug
            }
            console.log('No audio URL found for:', program.trackName); // Debug
        }

        function playTrack() {
            const audio = document.getElementById('audioPlayer');
            if (audio && audio.src) {
                console.log('Playing audio with src:', audio.src); // Debug
                audio.play().catch(e => console.error('Audio play failed:', e));
            } else {
                console.error('No audio element or src found'); // Debug
            }
        }

        function stopPlayback() {
            const audio = document.getElementById('audioPlayer');
            if (audio) { audio.pause(); audio.currentTime = 0; }
            document.getElementById('nowPlayingSection').style.display = 'none';
        }

        function closeAudioModal() {
            stopPlayback();
            document.getElementById('audioModal').style.display = 'none';
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && document.getElementById('audioModal').style.display === 'block') {
                closeAudioModal();
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            loadPrograms();
            
            // Check backend connection and fetch audio
            const backendConnected = await checkBackendConnection();
            if (backendConnected) {
                await fetchAudioUrls();
                console.log('Audio URLs loaded:', Object.keys(audioUrls));
            } else {
                console.log('Backend not available - using local audio files');
            }
    </script>
    <script src="/supabase-handler.js"></script>
</body>
</html>
