services:
  - type: web
    name: vialifecoach-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    sourceDir: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://www.vialifecoach.org,https://vialifecoach.org,https://academy.vialifecoach.org
